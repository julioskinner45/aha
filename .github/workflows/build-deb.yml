name: Build AHA .deb

# 新账号 GitHub 会自动取消 macOS runner 的任务（反滥用），但 Ubuntu 不限制。
# Theos 官方支持 Linux 交叉编译 iOS tweak，本工作流在 ubuntu-latest 上出最终 .deb。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (Linux toolchain + sdks + ldid)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos" | head -20

      - name: Build AHA.dylib (rootless / arm64)
        working-directory: tweak
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make FINALPACKAGE=1 ARCHS=arm64
          DYLIB="$(find . -name 'AHA.dylib' -not -path '*packages*' | head -1)"
          test -n "$DYLIB" || { echo "AHA.dylib 没找到"; exit 1; }
          echo "DYLIB_PATH=$DYLIB" >> "$GITHUB_ENV"
          file "$DYLIB"

      - name: Pack final .deb
        run: |
          python3 make_deb.py --dylib "$DYLIB_PATH"
          DEB="$(ls out/aha_*.deb | head -1)"
          echo "== final deb =="
          ls -la "$DEB"
          python3 make_deb.py --inspect "$DEB"

      - name: Upload final .deb
        uses: actions/upload-artifact@v4
        with:
          name: AHA-deb
          path: out/aha_*.deb
          if-no-files-found: error
          retention-days: 14
