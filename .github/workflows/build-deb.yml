name: Build AHA .deb

# 新账号 GitHub 会自动取消 macOS runner 任务（反滥用），Ubuntu 不限制。
# 手动装 Theos（绕开 install-theos 脚本的 api.github.com 限流问题）：
#   1) git clone --recursive 直接带上 sdks 子模块
#   2) 工具链/ldid 走 GitHub Releases 直链（不走 REST API，无限流）
#   3) python 打包出最终 .deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync perl libxml2 libtinfo6 xz-utils curl
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/ldid
          chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -V || true

      - name: Install Theos + sdks (git 协议，绕开 API 限流)
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls "$THEOS/sdks" | grep -i iphone | head -3

      - name: Install iOS toolchain (clang for apple targets)
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang" && "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2

      - name: Build AHA.dylib (rootless / arm64)
        working-directory: tweak
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make FINALPACKAGE=1 ARCHS=arm64
          DYLIB="$(find . -name 'AHA.dylib' -not -path '*packages*' | head -1)"
          test -n "$DYLIB" || { echo "AHA.dylib 没找到"; exit 1; }
          echo "DYLIB_PATH=$DYLIB" >> "$GITHUB_ENV"
          file "$DYLIB"

      - name: Pack final .deb
        run: |
          python3 make_deb.py --dylib "$DYLIB_PATH"
          DEB="$(ls out/aha_*.deb | head -1)"
          echo "== final deb =="
          ls -la "$DEB"
          python3 make_deb.py --inspect "$DEB"

      - name: Upload final .deb
        uses: actions/upload-artifact@v4
        with:
          name: AHA-deb
          path: out/aha_*.deb
          if-no-files-found: error
          retention-days: 14
